<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Playing Cards</title>
</head>

<body>
    <main id="playing-cards">

        <!-- Card 1: Ace of Spades -->
        <div class="card">
            <div class="left"><span class="rank">A</span><span class="suit">♠</span></div>
            <div class="middle">
                <span class="suit">♠</span>
            </div>
            <div class="right"><span class="rank">A</span><span class="suit">♠</span></div>
        </div>

        <!-- Card 2: Two of Clubs -->
        <div class="card">
            <div class="left"><span class="rank">2</span><span class="suit">♣</span></div>
            <div class="middle">
                <span class="suit">♣</span>
                <span class="suit flip">♣</span>
            </div>
            <div class="right"><span class="rank">2</span><span class="suit">♣</span></div>
        </div>

        <!-- Card 3: Three of Hearts -->
        <div class="card card3 red">
            <div class="left"><span class="rank">3</span><span class="suit">♥</span></div>
            <div class="middle">
                <span class="suit">♥</span>
                <span class="suit">♥</span>
                <span class="suit flip">♥</span>
            </div>
            <div class="right"><span class="rank">3</span><span class="suit">♥</span></div>
        </div>

        <!-- Card 4: Four of Clubs -->
        <div class="card card4">
            <div class="left"><span class="rank">4</span><span class="suit">♣</span></div>
            <div class="middle">
                <span class="suit">♣</span>
                <span class="suit">♣</span>
                <span class="suit flip">♣</span>
                <span class="suit flip">♣</span>
            </div>
            <div class="right"><span class="rank">4</span><span class="suit">♣</span></div>
        </div>

        <!-- Card 5: Five of Diamonds -->
        <div class="card card5 red">
            <div class="left"><span class="rank">5</span><span class="suit">♦</span></div>
            <div class="middle">
                <span class="suit">♦</span>
                <span class="suit">♦</span>
                <span class="suit">♦</span>
                <span class="suit">♦</span>
                <span class="suit">♦</span>
            </div>
            <div class="right"><span class="rank">5</span><span class="suit">♦</span></div>
        </div>

    </main>
</body>

</html>
